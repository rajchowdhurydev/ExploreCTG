<!doctype html>
<!-- Login page structure; authentication logic is local and lives in js/auth.js. -->
<html lang="en"><head>
<!-- Responsive metadata and shared visual rules. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Explore Chattogram</title><link rel="stylesheet" href="css/style.css">
</head><body class="auth-page">
<!-- Minimal account header keeps an accessible route back to the site. -->
<header class="auth-header container"><a class="brand" href="index.html"><span class="brand-mark">EC</span><span>Explore <strong>Chattogram</strong></span></a><a class="text-link" href="index.html">← Back to home</a></header>
<main class="auth-main"><section class="auth-card" aria-labelledby="login-title">
<!-- Login form uses native controls while auth.js validates and stores the session. -->
<div class="auth-intro"><p class="eyebrow">Welcome back</p><h1 id="login-title">Continue your journey</h1><p>Sign in to view your saved trips, budget plans and guide requests.</p></div>
<form id="login-form" novalidate>
<label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<label for="login-password">Password</label><div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" data-password-toggle data-target="login-password">Show</button></div>
<!-- Live feedback makes errors and successful logins accessible without alert dialogs. -->
<p class="form-message" id="login-message" aria-live="polite"></p><button class="button button-primary auth-submit" type="submit">Log in →</button>
</form><p class="auth-switch">New to Explore Chattogram? <a href="register.html">Create an account</a></p><p class="auth-note">Demo accounts are stored only in this browser using localStorage.</p>
</section></main>
<!-- The local authentication module is loaded after its form markup. --><script src="js/auth.js"></script>
</body></html>
